<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Demo</title>
<style>
:root {
  --bg-page: #f6f8f3;
  --card-bg: #ffffff;
  --primary-olive: #556b2f;
  --primary-dark: #435524;
  --olive-surface: #f1f5eb;
  --olive-border: #dde4d4;
  --text-main: #1e2617;
  --text-muted: #5e6b54;
  --error: #b42318;
  --shadow-card: 0 16px 40px -8px rgba(60, 75, 45, 0.12), 0 4px 12px rgba(60, 75, 45, 0.04);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg-page);
  color: var(--text-main);
  font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 20px;
}
main {
  width: min(440px, 92vw);
  background: var(--card-bg);
  padding: 34px 30px;
  border-radius: 20px;
  border: 1px solid var(--olive-border);
  box-shadow: var(--shadow-card);
}
h1 {
  margin: 0 0 10px;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-main);
}
p {
  color: var(--text-muted);
  line-height: 1.55;
  margin: 0 0 20px;
  font-size: 15px;
}
label {
  display: block;
  margin: 18px 0 6px;
  font-weight: 600;
  font-size: 14px;
  color: var(--text-main);
}
input {
  width: 100%;
  padding: 13px 14px;
  border: 1.5px solid var(--olive-border);
  border-radius: 10px;
  font: inherit;
  color: var(--text-main);
  background: #ffffff;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus {
  outline: none;
  border-color: var(--primary-olive);
  box-shadow: 0 0 0 3.5px rgba(85, 107, 47, 0.18);
}
input::placeholder {
  color: #9aa592;
}
button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: var(--primary-olive);
  color: #ffffff;
  font-weight: 700;
  font-size: 16px;
  margin-top: 22px;
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
  box-shadow: 0 3px 10px rgba(85, 107, 47, 0.22);
}
button:hover {
  background: var(--primary-dark);
}
button:active {
  transform: scale(0.99);
}
button:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}
small {
  display: block;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 20px;
  border-top: 1px solid var(--olive-border);
  padding-top: 16px;
}
#error {
  color: var(--error);
  font-size: 14px;
  margin-top: 12px;
  margin-bottom: 0;
  min-height: 18px;
  font-weight: 500;
}
</style>
</head>
<body>
<main>
<h1>Create a payment</h1>
<p>Enter your user ID and the exact amount to create a bank-transfer payment order.</p>
<form id="form">
<label>User ID</label><input id="user" required maxlength="128" placeholder="USER_123">
<label>Amount (INR)</label><input id="amount" type="number" min="1" max="1000000" step="0.01" required placeholder="100.00">
<button id="btn">Create payment session</button>
</form>
<p id="error"></p>
<small>Demo system. A transfer is not considered successful until verified against your bank account.</small>
</main>
<script>
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const errEl=document.getElementById('error');
 const btn=document.getElementById('btn')||e.target.querySelector('button');
 errEl.textContent='';
 btn.disabled=true;
 const originalText=btn.textContent;
 btn.textContent='Creating payment session...';
 try{
  const r=await fetch('/api/orders',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    user_id:document.getElementById('user').value.trim(),
    amount:Number(document.getElementById('amount').value)
   })
  });
  const d=await r.json();
  if(!r.ok)throw new Error(d.detail||'Could not create order');
  location.href=d.payment_url;
 }catch(err){
  errEl.textContent=err.message;
  btn.disabled=false;
  btn.textContent=originalText;
 }
});
</script>
</body>
</html>
